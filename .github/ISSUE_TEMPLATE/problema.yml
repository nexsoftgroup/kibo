name: Reportar un problema
description: Algo de Kibo no funciona como esperabas.
title: "[Problema] "
labels: ["problema"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por avisar. Antes de pegar registros o capturas, revisa que no tengan contraseñas, tokens ni datos de clientes.
  - type: input
    id: version
    attributes:
      label: Versión de Kibo
      description: La primera línea del menú Kibo dice tu versión (por ejemplo «Kibo 1.0.0»). También está en ⚙ Configuración → Versión.
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: sistema
    attributes:
      label: Sistema
      options:
        - Windows 11
        - Windows 10
        - Linux (Ubuntu u otra)
        - Linux en WSL
        - macOS
    validations:
      required: true
  - type: dropdown
    id: instalacion
    attributes:
      label: Cómo lo instalaste
      options:
        - Desde la terminal (install.ps1 o install.sh)
        - Con el instalador de doble clic (Windows)
        - No estoy seguro
  - type: textarea
    id: que_paso
    attributes:
      label: Qué pasó
      description: Qué esperabas y qué pasó en cambio.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para que vuelva a pasar
      placeholder: |
        1. Abro el proyecto…
        2. Toco…
        3. Aparece…
  - type: textarea
    id: extra
    attributes:
      label: Capturas o registros (opcional)
      description: Puedes arrastrar imágenes acá.
